<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Fox Management</title>
</h:head>

<h:body>

    <h1>Fox Management</h1>

    <h:form id="foxForm">

        <h:panelGrid columns="2">

            <h:outputLabel value="Name:"/>
            <h:inputText value="#{foxBean.fox.name}"/>

            <h:outputLabel value="Gender:"/>
            <h:selectOneMenu value="#{foxBean.fox.gender}">
                <f:selectItem itemLabel="Male" itemValue="MALE"/>
                <f:selectItem itemLabel="Female" itemValue="FEMALE"/>
            </h:selectOneMenu>

            <h:outputLabel value="Species:"/>
            <h:inputText value="#{foxBean.fox.species}"/>

            <h:outputLabel value="Image URL:"/>
            <h:inputText value="#{foxBean.fox.imageUrl}"/>

        </h:panelGrid>

        <br/>

        <p:commandButton value="Save Fox" action="#{foxBean.save}" update="@form" />

        <br/><br/>

        <p:dataTable value="#{foxBean.foxes}"
                     var="fox"
                     paginator="true"
                     rows="10">

            <p:column headerText="ID" sortBy="#{fox.id}">
                <h:outputText value="#{fox.id}" />
            </p:column>

            <p:column headerText="Name"
                      sortBy="#{fox.name}"
                      filterBy="#{fox.name}">
                <h:outputText value="#{fox.name}" />
            </p:column>

            <p:column headerText="Species"
                      sortBy="#{fox.species}"
                      filterBy="#{fox.species}">
                <h:outputText value="#{fox.species}" />
            </p:column>

            <p:column headerText="Gender"
                      sortBy="#{fox.gender}"
                      filterBy="#{fox.gender}">
                <h:outputText value="#{fox.gender}" />
            </p:column>

            <p:column headerText="Image">
                <h:graphicImage value="#{fox.imageUrl}"
                                width="120"
                                rendered="#{not empty fox.imageUrl}" />

                <h:outputText value="No image"
                              rendered="#{empty fox.imageUrl}" />
            </p:column>

            <p:column headerText="Actions">
                <p:commandButton value="Delete"
                                 action="#{foxBean.delete(fox.id)}"
                                 update="@form" />
            </p:column>

        </p:dataTable>

    </h:form>

</h:body>
</html>
